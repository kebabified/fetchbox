[package]
name = "fetchbox"
version = "2.0.6"
edition = "2021"
license = "MIT"
description = "Media downloader: yt-dlp + cobalt, with a browser extension"
build = "build.rs"

[lib]
name = "fetchbox"
path = "src/lib.rs"

[[bin]]
name = "fetchbox"
path = "src/bin/gui.rs"

[[bin]]
name = "fetchbox-host"
path = "src/bin/host.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.20"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls", "json", "gzip"] }
sha2 = "0.11.1"
base64 = "0.23.1"
arboard = "3.7.0"
rfd = "0.18.0"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_IO", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1"
